    .day-date {font-size:12px;}
    .pause-count {height:22px;min-width:22px;font-size:12px;}
    .legend {margin-top:9px;gap:20px;font-size:12px;}
    details {margin-top:11px;}
    summary {min-height:48px;padding:13px 16px;}
    /* Intervention: keep controls reachable and retain readable, calm typography. */
    .back {min-height:38px;margin-bottom:5px;}
    .activity {padding:18px 16px;margin:10px 0 10px;}
    .orb {width:114px;height:114px;margin:4px auto 8px;}
    .timer {font-size:37px;margin-bottom:4px;}
    .encourage {font-size:15px;min-height:35px;margin-top:9px;}
    .timer-control {min-height:42px;margin-bottom:3px;}
    .button {min-height:49px;}
    .option-list {gap:8px;}
    .option-chip {min-height:50px;font-size:15px;}
    .result-option {min-height:60px;}
    @media(max-width:360px){
      .header {padding:10px 16px;}
      .main {padding:21px 16px 22px;}
      h1{font-size:42px;}
      .choice{min-height:80px;padding:12px 13px;gap:11px;}
      .symbol{width:43px;height:43px;}
      .chart.chart-14{padding:10px 8px;}
      .week-grid{gap:4px;}
      .day-date,.chart.chart-14 .day .value{font-size:11px;}
    }
    @media(max-height:720px) and (max-width:599px){
      .header {padding-top:7px;padding-bottom:7px;}
      .main {padding-top:17px;padding-bottom:15px;}
      .kicker {margin-bottom:7px;}
      h1 {font-size:42px;margin-bottom:8px;}
      .hero-note {font-size:15px;margin-bottom:12px;}
      .choice {min-height:75px;padding-top:10px;padding-bottom:10px;}
      .choices {gap:8px;}
      .tab {min-height:48px;}
      .footer {padding-top:4px;padding-bottom:calc(4px + env(safe-area-inset-bottom));}
      .activity{padding:14px 14px;margin:8px 0;}
      .orb{width:98px;height:98px;border-width:8px;}
      .timer{font-size:33px;}
      .option-chip {min-height:44px;}
    }
    @media(max-height:600px) and (max-width:599px){
      .hero-note {margin-bottom:9px;}
      .choice {min-height:69px;}
      .choice-copy small{font-size:13px;}
      .footer{padding-top:3px;padding-bottom:calc(3px + env(safe-area-inset-bottom));}
    }
    @media(max-width:599px){
      /* Two readable week rows, trimmed of redundant labels. */
      .main:has(.mini-grid){padding-top:14px;padding-bottom:15px;}
      .main:has(.mini-grid) .kicker{margin-bottom:5px;}
      .main:has(.mini-grid) h1{font-size:40px;margin-bottom:11px;}
      .mini-card{padding:10px 14px 9px;}
      .mini-card strong{font-size:39px;}
      .mini-grid{margin-bottom:8px;}
      .quick-buttons{margin-bottom:12px;}
      .action{min-height:49px;}
      .section-title{margin-bottom:6px;}
      .chart.chart-14{gap:6px;padding:10px 10px 8px;}
      .week-name{display:none;}
      .week-block+.week-block{padding-top:7px;}
      .week-grid{gap:4px;}
      .day{gap:2px;padding:4px 2px 5px;min-height:90px;}
      .day-numbers{min-height:14px;}
      .track{height:28px;}
      .day-date{font-size:10px;}
      .pause-count{min-height:18px;min-width:28px;font-size:10px;padding:0 5px;}
      .legend{margin-top:7px;}
    }
    @media(min-width:600px){
      .app{min-height:calc(100dvh - 36px);}
    }
  </style>
</head>
<body>
<div class="app">
  <header class="header">
    <div class="brand"><span class="mark" aria-hidden="true"><svg class="brand-glyph" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M9.5 8.5v7M14.5 8.5v7" stroke-width="2"/></svg></span>PACKPAUSE</div>
    <button id="settingsButton" class="icon-btn" type="button" aria-label="Settings" title="Settings">⋯</button>
  </header>
  <div class="banner hidden" id="demoBanner"><span>DEMO · SAMPLE DATA</span><button type="button" id="endDemo">Exit</button></div>
  <main class="main" id="content" aria-live="polite"></main>
  <nav class="footer" aria-label="Main navigation">
    <button class="tab selected" type="button" data-tab="today"><span aria-hidden="true"><svg class="nav-glyph" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="5" width="16" height="15" rx="3"/><path d="M8 3.5v3M16 3.5v3M4 10h16M8.5 14h3M8.5 17h6"/></svg></span>Today</button>
    <button class="tab" type="button" data-tab="pause"><span aria-hidden="true"><svg class="nav-glyph" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M9.5 8.5v7M14.5 8.5v7" stroke-width="2"/></svg></span>Pause</button>
  </nav>
</div>
<div class="notice hidden" id="notice" aria-live="polite" role="status"></div>
<script>
(()=>{
  'use strict';
  const KEY='packpause-v18-final';
  const LEGACY=['packpause-v18','packpause-v17','packpause-v16','packpause-v15','packpause-v14','packpause-v13','packpause-v12','packpause-v10','packpause-v9','packpause-v8','packpause-v7','packpause-v6','packpause-v5','packpause-v4','packpause-v3','packpause-v2','packpause-v1'];
  const $=q=>document.querySelector(q);
  const root=$('#content');
  const dateString=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  const today=()=>dateString(new Date());
  const shifted=i=>{const d=new Date();d.setHours(12,0,0,0);d.setDate(d.getDate()+i);return d;};
  const validDay=s=>{if(typeof s!=='string'||!/^[0-9]{4}-[0-9]{2}-[0-9]{2}$/.test(s))return false;const [y,m,d]=s.split('-').map(Number);const dt=new Date(y,m-1,d,12);return dt.getFullYear()===y&&dt.getMonth()+1===m&&dt.getDate()===d;};
  const isValidStamp=s=>typeof s==='string'&&!Number.isNaN(new Date(s).getTime());
  const number=(v,max=100)=>Number.isFinite(Number(v))?Math.max(0,Math.min(max,Math.round(Number(v)))):0;
  const blank=()=>({entries:[],completedDays:{},dailyDrafts:{},pauseTotals:{},cigarettes:[],smokeFreeDays:[],createdAt:new Date().toISOString()});
  function clean(src){
    const d=blank();if(!src||typeof src!=='object'||Array.isArray(src))return d;
    if(Array.isArray(src.entries))d.entries=src.entries.filter(e=>e&&['stress','boredom','social','general'].includes(e.trigger)&&['avoided','smoked','unsure'].includes(e.outcome)&&isValidStamp(e.at)).slice(-2000).map(e=>({at:e.at,trigger:e.trigger,outcome:e.outcome}));
    for(const key of ['completedDays','dailyDrafts','pauseTotals']){const obj=src[key];if(obj&&typeof obj==='object'&&!Array.isArray(obj))for(const [date,n] of Object.entries(obj).slice(-600))if(validDay(date)&&Number.isInteger(n)&&n>=0&&n<=1000)d[key][date]=n;}
    if(Array.isArray(src.cigarettes))d.cigarettes=src.cigarettes.filter(e=>e&&isValidStamp(e.at)).slice(-2000).map(e=>({at:e.at,count:number(e.count)}));
    if(Array.isArray(src.smokeFreeDays))d.smokeFreeDays=src.smokeFreeDays.filter(validDay).slice(-600);
    return d;
  }
  function read(){for(const key of [KEY,...LEGACY])try{const s=localStorage.getItem(key);if(s)return clean(JSON.parse(s));}catch(e){}return blank();}
  let saved=read(),sample=null,demo=new URLSearchParams(location.search).get('mode')==='demo';
  let view='today',trigger='stress',interval=null,running=false,seconds=60,deadline=0,toastTimeout=null,lastRotatedQuoteSecond=null;
  const model=()=>demo?sample:saved;
  const stamp=()=>new Date().toISOString();
  function commit(change){const before=JSON.stringify(model());change(model());if(demo)return {ok:true,before};try{localStorage.setItem(KEY,JSON.stringify(saved));return {ok:true,before};}catch(e){saved=JSON.parse(before);return {ok:false,before};}}
  function notify(message,undo){const el=$('#notice');clearTimeout(toastTimeout);el.replaceChildren(document.createTextNode(message));if(undo){const btn=document.createElement('button');btn.type='button';btn.textContent='Undo';btn.onclick=()=>{clearTimeout(toastTimeout);el.classList.add('hidden');undo();};el.append(btn);}el.classList.remove('hidden');toastTimeout=setTimeout(()=>el.classList.add('hidden'),undo?6500:3000);}
  function mutate(change,message='Saved.'){
    const outcome=commit(change);if(outcome.ok){render();notify(message,()=>{if(demo){sample=JSON.parse(outcome.before);render();notify('Undone.');}else{const current=JSON.stringify(saved);saved=JSON.parse(outcome.before);try{localStorage.setItem(KEY,JSON.stringify(saved));render();notify('Undone.');}catch(e){saved=JSON.parse(current);render();notify('Could not undo.');}}});}
    else{render();notify('Could not save on this device.');}
  }
  function resetTimer(){if(interval)clearInterval(interval);interval=null;running=false;}
  function navigate(to){resetTimer();view=to;window.scrollTo(0,0);const active=['activity','check','pause'].includes(to)?'pause':to==='settings'?null:'today';document.querySelectorAll('[data-tab]').forEach(b=>{b.classList.toggle('selected',b.dataset.tab===active);if(b.dataset.tab===active)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current');});$('#demoBanner').classList.toggle('hidden',!demo);render();}
  function render(){switch(view){case 'pause':return pause();case 'activity':return activity();case 'check':return check();case 'settings':return settings();default:return todayView();}}
  function getCount(date,d=model()){
    if(Object.prototype.hasOwnProperty.call(d.completedDays,date))return {count:d.completedDays[date],status:date===today()?'partial':'complete'};
    if(Object.prototype.hasOwnProperty.call(d.dailyDrafts,date))return {count:d.dailyDrafts[date],status:'partial'};
    const rows=d.cigarettes.filter(x=>dateString(new Date(x.at))===date);
    if(rows.length)return {count:rows.reduce((a,b)=>a+number(b.count),0),status:'partial'};
    if(d.smokeFreeDays.includes(date))return {count:0,status:'partial'};
    return {count:0,status:'none'};
  }
  function getPauseCount(date,d=model()){
    if(d.pauseTotals&&Object.prototype.hasOwnProperty.call(d.pauseTotals,date))return number(d.pauseTotals[date],1000);
    return d.entries.filter(e=>e.outcome==='avoided'&&dateString(new Date(e.at))===date).length;
  }
  function incrementPause(d,date=today()){
    if(!d.pauseTotals||typeof d.pauseTotals!=='object')d.pauseTotals={};
    d.pauseTotals[date]=Math.min(1000,getPauseCount(date,d)+1);
  }
  function addOne(d,date=today()){
    const old=getCount(date,d);d.dailyDrafts[date]=Math.min(100,old.count+1);delete d.completedDays[date];
  }
  function todayView(){
    const d=model();
    const todaySmoked=getCount(today(),d);
    const todayPaused=getPauseCount(today(),d);
    const dates=Array.from({length:14},(_,i)=>dateString(shifted(i-13)));
    const rows=dates.map(date=>({...getCount(date,d),paused:getPauseCount(date,d),date}));
    const max=Math.max(5,...rows.map(x=>x.count));
    const totalSmoked=rows.reduce((a,b)=>a+b.count,0);
    const totalPaused=rows.reduce((a,b)=>a+b.paused,0);
    const makeDay=(r)=>{const dt=new Date(r.date+'T12:00:00'),label=String(dt.getDate()),height=r.status==='none'?3:r.count===0?3:Math.max(4,Math.round(25*r.count/max));const cigarettes=r.status==='none'?'—':r.count;return `<div class="day" title="${r.date}: ${r.status==='none'?'no cigarette record':r.count+' cigarettes'}; ${r.paused} pauses"><div class="day-numbers"><span class="value">S ${cigarettes}</span></div><div class="track"><div class="bar ${r.status==='complete'?'':'partial'} ${r.status==='none'?'none':''} ${r.status!=='none'&&r.count===0?'zero':''}" style="height:${height}px"></div></div><span class="day-date">${label}</span><span class="pause-count" aria-label="${r.paused} pauses">P ${r.paused}</span></div>`;};
    const chart=`<div class="week-block"><div class="week-name">DAYS 1–7</div><div class="week-grid">${rows.slice(0,7).map(makeDay).join('')}</div></div><div class="week-block"><div class="week-name">DAYS 8–14</div><div class="week-grid">${rows.slice(7).map(makeDay).join('')}</div></div>`;
    const dayLabel=new Date().toLocaleDateString('en-SG',{weekday:'long',day:'numeric',month:'short'});
    root.innerHTML=`<div class="screen"><p class="kicker">TODAY · ${dayLabel.toUpperCase()}</p><h1>Today.</h1><div class="top-actions"><button type="button" class="ghost-link" id="openPause"><span aria-hidden="true"><svg class="nav-glyph" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M9.5 8.5v7M14.5 8.5v7" stroke-width="2"/></svg></span>Pause</button><button type="button" class="ghost-link soft" id="openSettings">Menu</button></div><div class="mini-grid"><div class="mini-card"><span class="mini-label">Smoked</span><strong>${todaySmoked.status==='none'?'—':todaySmoked.count}</strong></div><div class="mini-card accent"><span class="mini-label">Paused</span><strong>${todayPaused}</strong></div></div><div class="quick-buttons"><button type="button" class="action" id="smoked"><span aria-hidden="true">＋</span>Smoked</button><button type="button" class="action primary" id="notNow"><span aria-hidden="true">✓</span>Paused</button></div><div class="section-title">Last 14 days <span class="hint">${totalSmoked} smoked · ${totalPaused} paused</span></div>${rows.some(r=>r.status!=='none'||r.paused)?`<div class="chart chart-14" role="img" aria-label="Fourteen-day chart. Each day shows S for smoked and P for paused.">${chart}</div><p class="tiny legend"><span class="legend-key"><i class="legend-bar"></i>S = smoked</span><span class="legend-key"><i class="legend-dot"></i>P = paused</span></p>`:'<div class="empty-chart">Your first record starts today.</div>'}<details><summary>Edit totals</summary><form class="inside" id="dailyForm"><div class="inputs inputs-3"><div><label class="field" for="logDate">Date</label><input class="input" id="logDate" type="date" required max="${today()}" value="${today()}"></div><div><label class="field" for="logCount">Smoked</label><input class="input" id="logCount" type="number" min="0" max="100" step="1" required value="${todaySmoked.status==='none'?'':todaySmoked.count}" placeholder="0"></div><div><label class="field" for="logPause">Paused</label><input class="input" id="logPause" type="number" min="0" max="1000" step="1" required value="${todayPaused}" placeholder="0"></div></div><button type="submit" class="button">Save</button><p class="tiny">Fix a tap if needed.</p></form></details></div>`;
    $('#openPause').onclick=()=>navigate('pause');
    $('#openSettings').onclick=()=>navigate('settings');
    $('#smoked').onclick=()=>mutate(addOne,'Smoked saved.');
    $('#notNow').onclick=()=>mutate(x=>{incrementPause(x);x.entries.push({at:stamp(),trigger:'general',outcome:'avoided'});},'Paused saved.');
    $('#logDate').onchange=()=>{const date=$('#logDate').value;const item=getCount(date,d);$('#logCount').value=item.status==='none'?'':String(item.count);$('#logPause').value=String(getPauseCount(date,d));};
    $('#dailyForm').onsubmit=e=>{e.preventDefault();const date=$('#logDate').value,smoked=Number($('#logCount').value),paused=Number($('#logPause').value);if(!validDay(date)||date>today()||!Number.isInteger(smoked)||smoked<0||smoked>100||!Number.isInteger(paused)||paused<0||paused>1000){notify('Check the totals.');return;}mutate(x=>{if(date===today()){x.dailyDrafts[date]=smoked;delete x.completedDays[date];}else{x.completedDays[date]=smoked;delete x.dailyDrafts[date];}if(!x.pauseTotals||typeof x.pauseTotals!=='object')x.pauseTotals={};x.pauseTotals[date]=paused;},'Totals saved.');};
  }
  function pause(){
    root.innerHTML=`<div class="screen"><p class="kicker">PACKPAUSE</p><h1>Pause.</h1><p class="hero-note">One moment. Your choice.</p><div class="top-actions"><button type="button" class="ghost-link" id="openToday"><span aria-hidden="true"><svg class="nav-glyph" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="5" width="16" height="15" rx="3"/><path d="M8 3.5v3M16 3.5v3M4 10h16M8.5 14h3M8.5 17h6"/></svg></span>Today</button><button type="button" class="ghost-link soft" id="openSettings">Menu</button></div><div class="choices"><button class="choice" data-trigger="stress"><span class="symbol" aria-hidden="true"><svg class="glyph" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M3 8c2.5-3 4.5 3 7 0s4.5-3 7 0 3.5.5 4 0"/><path d="M3 16c2.5-3 4.5 3 7 0s4.5-3 7 0 3.5.5 4 0"/></svg></span><span class="choice-copy">Stress<small>slow it down</small></span><span class="arrow" aria-hidden="true">›</span></button><button class="choice" data-trigger="boredom"><span class="symbol" aria-hidden="true"><svg class="glyph" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3 1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/><path d="M19 17v4m-2-2h4M5 17v3m-1.5-1.5h3"/></svg></span><span class="choice-copy">Boredom<small>break the pattern</small></span><span class="arrow" aria-hidden="true">›</span></button><button class="choice" data-trigger="social"><span class="symbol" aria-hidden="true"><svg class="glyph" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11.5a7.5 7.5 0 0 1-7.5 7.5c-1.25 0-2.7-.36-3.7-.96L4 20l1.4-4.1A7.5 7.5 0 1 1 20 11.5Z"/><path d="M8.7 11.7h7"/></svg></span><span class="choice-copy">Social<small>say something simple</small></span><span class="arrow" aria-hidden="true">›</span></button></div></div>`;
    $('#openToday').onclick=()=>navigate('today');
    $('#openSettings').onclick=()=>navigate('settings');
    root.querySelectorAll('[data-trigger]').forEach(b=>b.onclick=()=>{trigger=b.dataset.trigger;seconds=60;navigate('activity');});
  }
  function activity(){
    const type=trigger||'stress';let inside='';
    if(type==='stress')inside=`<div class="activity"><div class="orb" id="orb">Breathe</div><div class="timer" id="timer">01:00</div><div id="breathText" class="subtle">In for 4 · Out for 6</div><p class="encourage" id="encourageText"></p></div><button class="timer-control" id="startTimer" type="button">Pause timer</button><button class="button" id="continue" type="button">Continue</button>`;
    if(type==='boredom')inside=`<div class="activity"><div class="big">Try one.</div><div class="option-list"><button class="option-chip" data-choice="Water" type="button">Water</button><button class="option-chip" data-choice="Walk" type="button">Walk</button><button class="option-chip" data-choice="Nicotine gum" type="button">Nicotine gum</button><button class="option-chip" data-choice="Text someone" type="button">Text someone</button></div><p class="hint">Pick the easiest one now.</p></div>`;
    if(type==='social')inside=`<div class="activity"><div class="big">Try saying:</div><div class="option-list"><button class="option-chip" data-choice="I'm good, not now." type="button">I'm good, not now.</button><button class="option-chip" data-choice="You go ahead. I'll pass." type="button">You go ahead. I'll pass.</button><button class="option-chip" data-choice="I'm cutting down." type="button">I'm cutting down.</button><button class="option-chip" data-choice="I'll still come, just not smoking." type="button">I'll still come, just not smoking.</button></div><p class="hint">Pick one that feels natural.</p></div>`;
    root.innerHTML=`<div class="screen"><button class="back" id="back" type="button">← Back</button><p class="kicker">${type.toUpperCase()==='SOCIAL'?'SOCIAL':type.toUpperCase()}</p><h2>${type==='stress'?'Take a minute.':type==='boredom'?'Shift it.':'Say less.'}</h2>${inside}</div>`;
    $('#back').onclick=()=>navigate('pause');
    if(type==='stress'){
      let lastQuote='';lastRotatedQuoteSecond=null;
      const quotes=['You can let this pass.','One minute is enough to reset.','A smaller choice still counts.','You do not need to light it now.','This urge will move on.','One pause can change the next hour.'];
      const setQuote=()=>{const options=quotes.filter(q=>q!==lastQuote);lastQuote=options[Math.floor(Math.random()*options.length)]||quotes[0];const el=$('#encourageText');if(el)el.textContent=lastQuote;};
      setQuote();
      $('#continue').onclick=()=>navigate('check');
      $('#startTimer').onclick=()=>{const b=$('#startTimer'),o=$('#orb');if(running){resetTimer();b.textContent='Resume timer';o.classList.remove('animating');o.textContent='Paused';return;}if(seconds<=0)seconds=60;running=true;deadline=Date.now()+seconds*1000;b.textContent='Pause timer';o.style.animationDelay=`-${(60-seconds)%10}s`;o.classList.add('animating');tick(setQuote);interval=setInterval(()=>tick(setQuote),250);};
      $('#startTimer').click();
      return;
    }
    root.querySelectorAll('[data-choice]').forEach(btn=>btn.onclick=()=>navigate('check'));
  }
  function tick(updateQuote){if(!running)return;seconds=Math.max(0,Math.ceil((deadline-Date.now())/1000));const timer=$('#timer'),o=$('#orb'),btn=$('#startTimer');if(!timer||!o||!btn){resetTimer();return;}timer.textContent=`${String(Math.floor(seconds/60)).padStart(2,'0')}:${String(seconds%60).padStart(2,'0')}`;o.textContent=(60-seconds)%10<4?'Breathe in':'Breathe out';if(updateQuote&&seconds>0&&seconds<60&&seconds%12===0&&seconds!==lastRotatedQuoteSecond){lastRotatedQuoteSecond=seconds;updateQuote();}if(seconds===0){resetTimer();o.classList.remove('animating');o.textContent='Done';btn.textContent='Restart timer';$('#breathText').textContent='You took a moment.';}}
  function check(){
    root.innerHTML=`<div class="screen"><button class="back" type="button" id="back">← Back</button><p class="kicker">CHECK-IN</p><h1>Result.</h1><div class="results"><button type="button" class="result-option" data-outcome="avoided"><span aria-hidden="true">✓</span>No smoke</button><button type="button" class="result-option" data-outcome="smoked"><span aria-hidden="true">＋</span>Smoked +1</button><button type="button" class="result-option" data-outcome="unsure"><span aria-hidden="true">•</span>Later</button></div><p class="result-quiet">Just a record.</p></div>`;
    $('#back').onclick=()=>navigate('activity');root.querySelectorAll('[data-outcome]').forEach(b=>b.onclick=()=>{
      const outcome=b.dataset.outcome,update=commit(d=>{if(outcome==='avoided')incrementPause(d);d.entries.push({at:stamp(),trigger,outcome});if(outcome==='smoked')addOne(d);});
      navigate('today');if(!update.ok){notify('Could not save on this device.');return;}
      notify('Recorded.',()=>{if(demo){sample=JSON.parse(update.before);render();notify('Undone.');}else{saved=JSON.parse(update.before);try{localStorage.setItem(KEY,JSON.stringify(saved));render();notify('Undone.');}catch(e){notify('Could not undo.');}}});
    });
  }
  function sampleData(){const d=blank();const smoked=[7,6,7,5,6,4,5,4,3,4,3,2,3,2];const paused=[0,1,1,1,2,1,2,2,2,3,2,3,4,3];smoked.forEach((n,i)=>{const date=dateString(shifted(i-13));if(i>=12)d.dailyDrafts[date]=n;else d.completedDays[date]=n;d.pauseTotals[date]=paused[i];});[['stress','avoided'],['social','smoked'],['general','avoided'],['boredom','avoided'],['stress','avoided'],['general','avoided'],['social','unsure']].forEach(([trigger,outcome],i)=>d.entries.push({trigger,outcome,at:shifted(i-6).toISOString()}));return d;}
  function setDemo(on){demo=on;sample=on?sampleData():null;try{const u=new URL(location.href);u.search=on?'?mode=demo':'';history.replaceState(null,'',u.toString());}catch(e){}navigate('today');notify(on?'Sample data only.':'Demo closed.');}
  function nfcURL(){const u=new URL(location.href);u.hash='';u.search='';return u.toString();}
  function settings(){const url=nfcURL();root.innerHTML=`<div class="screen"><button class="back" id="back" type="button">← Back</button><p class="kicker">PACKPAUSE</p><h1>Settings.</h1><div class="setting-item"><h3>Demo mode</h3><p>Sample records for presentation.</p><button class="button secondary" id="demoToggle" type="button">${demo?'Exit demo':'Try demo'}</button></div><div class="setting-item"><h3>NFC link</h3><p>Use this same link for NFC and the Safari home-screen shortcut.</p><div class="mono" id="linkText"></div><button class="button secondary" id="copyLink" type="button">Copy link</button></div><div class="setting-item"><h3>Your data</h3><p>Stored only in this browser.</p><div class="buttons"><button class="button secondary" id="export" type="button" ${demo?'disabled':''}>Export data</button><button class="button light" id="delete" type="button" ${demo?'disabled':''}>Delete data</button></div></div><p class="tiny">Student prototype. Professional support can help.</p></div>`;
    $('#linkText').textContent=url;$('#back').onclick=()=>navigate('today');$('#demoToggle').onclick=()=>setDemo(!demo);
    $('#copyLink').onclick=async()=>{try{await navigator.clipboard.writeText(url);notify('Link copied.');}catch(e){const s=window.getSelection(),r=document.createRange();r.selectNodeContents($('#linkText'));s.removeAllRanges();s.addRange(r);notify('Link selected. Copy manually.');}};
    $('#export').onclick=()=>{if(demo)return;const blob=new Blob([JSON.stringify(saved,null,2)],{type:'application/json'}),uri=URL.createObjectURL(blob),a=document.createElement('a');a.href=uri;a.download='packpause-'+today()+'.json';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(uri),1200);};
    $('#delete').onclick=()=>{if(demo||!confirm('Delete your data on this device?'))return;const before=JSON.stringify(saved);saved=blank();try{localStorage.setItem(KEY,JSON.stringify(saved));navigate('today');notify('Data deleted.');}catch(e){saved=JSON.parse(before);notify('Could not delete data.');}};
  }
  document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>navigate(b.dataset.tab));$('#settingsButton').onclick=()=>navigate('settings');$('#endDemo').onclick=()=>setDemo(false);
  if(demo)sample=sampleData();
  navigate('pause');
  document.addEventListener('visibilitychange',()=>{if(document.hidden&&running){resetTimer();const o=$('#orb'),b=$('#startTimer');if(o){o.classList.remove('animating');o.textContent='Paused';}if(b)b.textContent='Resume timer';}});
})();
</script>
</body>
